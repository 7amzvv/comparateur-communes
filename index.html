<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparateur de communes</title>
</head>
<body>
    <main>
        <h1>Comparateur de communes</h1>
        <form id="search-form" novalidate>
            <label for="query">Nom ou code postal</label>
            <input id="query" name="query" type="search" required>
            <button type="submit" disabled>Rechercher</button>
        </form>
        <p id="status" role="status"></p>
    </main>
</body>
</html>
