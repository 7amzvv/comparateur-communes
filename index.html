<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparateur de communes</title>
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Comparateur de communes</h1>
        <form id="search-form" novalidate>
            <label for="query">Nom ou code postal</label>
            <input id="query" name="query" type="search" required>
            <button type="submit">Rechercher</button>
        </form>
        <p id="status" role="status"></p>
        <ul id="commune-results" aria-label="Communes trouvées"></ul>
        <section id="commune-details" aria-labelledby="commune-name" hidden>
            <h2 id="commune-name" tabindex="-1"></h2>
            <dl>
                <dt>Population</dt>
                <dd id="population"></dd>
                <dt>Département</dt>
                <dd id="department"></dd>
                <dt>Région</dt>
                <dd id="region"></dd>
                <dt>Codes postaux</dt>
                <dd id="postal-codes"></dd>
            </dl>
        </section>
    </main>
</body>
</html>
